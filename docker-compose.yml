services:
  nyt-midi-receipt:
    # Pulled from ghcr by default; `docker compose build` still works locally.
    image: ${NYT_MIDI_RECEIPT_IMAGE:-ghcr.io/matttt/nytmidireceipt:latest}
    build: .
    container_name: nyt-midi-receipt
    restart: unless-stopped
    ports:
      - "6434:6434"
    environment:
      PRINTER_HOST: 192.168.10.11
      RECEIPT_WIDTH: 48
